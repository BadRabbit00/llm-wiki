name: Release image

# Every merge into main and every v* tag publishes the container image to GHCR.
# The server pulls it by digest; the attestation proves that digest was built by
# this workflow from this commit. CI stays read-only; only this job can write.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/badrabbit00/llm-wiki
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build
        run: nix build .#image --out-link image.tar.gz
      - name: Smoke test
        run: scripts/smoke-image.sh image.tar.gz
      - name: Push to GHCR
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tags=("sha-${GITHUB_SHA::7}")
          if [[ $REF_TYPE == tag ]]; then
            tags+=("$REF_NAME")
          elif [[ $REF_NAME == main ]]; then
            tags+=(main)
          fi
          # Docker's config file: the attestation step reads registry credentials from it.
          mkdir -p "$HOME/.docker"
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          skopeo=(nix shell --inputs-from . nixpkgs#skopeo -c skopeo)
          "${skopeo[@]}" login --username "$REGISTRY_USER" --password-stdin ghcr.io <<<"$REGISTRY_TOKEN"
          for tag in "${tags[@]}"; do
            # The trust policy governs images pulled from elsewhere; this is our own build.
            "${skopeo[@]}" copy --insecure-policy --digestfile digest \
              docker-archive:image.tar.gz "docker://$IMAGE:$tag"
          done
          echo "digest=$(cat digest)" >>"$GITHUB_OUTPUT"
          {
            echo "### $IMAGE@$(cat digest)"
            printf -- '- %s\n' "${tags[@]}"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
