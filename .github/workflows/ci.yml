name: CI

# develop: fast static checks on every push. A pull request into main is a release
# candidate: it additionally builds every flake output (pytest with coverage, Go
# and TypeScript, deployment shellcheck), starts the container image and runs the
# browser scenarios. Publishing the image is release.yml's job, not this one.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Flake outputs evaluate
        run: nix flake check --no-build
      - name: Ruff and mypy
        run: nix develop -c just lint
      - name: UI dependencies
        run: nix develop -c npm --prefix ui ci --no-audit --no-fund
      - name: Prettier
        run: nix develop -c npm --prefix ui run format:check
      - name: TypeScript
        run: nix develop -c npm --prefix ui run typecheck
      - name: Go vet and gofmt
        run: |
          nix develop -c go -C ui vet ./...
          unformatted=$(git ls-files -z '*.go' | xargs -0 nix develop -c gofmt -l)
          test -z "$unformatted" || { echo "gofmt would change: $unformatted"; exit 1; }
      - name: ShellCheck
        run: nix shell --inputs-from . nixpkgs#shellcheck -c shellcheck deploy/*.sh

  full:
    name: Build and test every flake output
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check -L
      # Reuses the closures the check just built; only the image layers are new.
      - name: Container image starts
        run: |
          nix build .#image --out-link image.tar.gz
          scripts/smoke-image.sh image.tar.gz

  e2e:
    name: Browser scenarios
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: UI dependencies
        run: nix develop -c npm --prefix ui ci --no-audit --no-fund
      # The runner image ships Google Chrome; Playwright's own Chromium would need apt.
      - name: Playwright against real wikisvc, wikiagent and wiki-ui
        run: CHROME_BIN="$(command -v google-chrome)" nix develop -c npm --prefix ui test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: |
            ui/test-results/
            ui/.e2e/*.png
          retention-days: 7
