# `a` and `b` are fact IDs of tests/fixtures/kb; the text to compare is the `claim` of each
# page (the `summary` is the decontextualised form of the same claim). Optional `note` marks
# why an `independent` pair is a hard negative: `version-superseded` (same statement for
# disjoint `valid_for` kernel ranges, joined by `replaces` new -> old) or `related` (joined
# by a `related` edge). Scheme per label:
#   duplicate   - `a` restates `b` (a page attached to a tech page only); no edge between them.
#   refines     - `a` carries `relations.refines: [b]`: a narrower case of `b`.
#   contradicts - `a` is a misconception with `confidence: contested` and
#                 `relations.contradicts: [b]`, same applicability as the canonical `b`.
#   independent - no refines/contradicts edge; hand-picked hard negatives (same hub or shared
#                 keyword), the noted pairs above, and pairs from different hubs drawn with a
#                 fixed seed.
