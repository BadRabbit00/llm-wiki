[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikisvc"
version = "0.1.0"
description = "Deterministic git-backed wiki service for agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn", "pydantic>=2", "pydantic-settings", "ruamel.yaml",
  "pystemmer", "python-multipart", "typer", "httpx", "mcp>=1.29,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "ruff"]
documents = ["pypdf", "python-docx"]

[project.scripts]
wikisvc = "wikisvc.cli:app"
wikiagent = "wikiagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wikisvc", "src/wikiagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["Stemmer", "pypdf", "docx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["wikisvc.domain", "wikisvc.index"]

[tool.coverage.report]
show_missing = true
fail_under = 85
