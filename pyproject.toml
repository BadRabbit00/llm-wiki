[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikisvc"
version = "0.3.2"
description = "Deterministic git-backed wiki service for agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn", "pydantic>=2", "pydantic-settings", "ruamel.yaml",
  "pystemmer", "python-multipart", "typer", "httpx", "pypdf", "python-docx", "mcp>=1.29,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "ruff"]

[project.scripts]
wikisvc = "wikisvc.cli:app"
wikiagent = "wikiagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wikisvc", "src/wikiagent"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ref/ holds the knowledge-layer spec and the pre-template docs: prose with
# illustrative snippets, not code; ruff would otherwise reformat them.
extend-exclude = ["ref"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["Stemmer", "pypdf", "docx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: quality evaluation of search/answers, not run by default (just eval)",
    "perf: performance checks, not run by default, not a CI gate (just perf)",
]
addopts = "-m 'not eval and not perf'"

[tool.coverage.run]
source = ["wikisvc", "wikiagent"]
branch = true
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
fail_under = 98
exclude_also = ['if __name__ == "__main__":']
