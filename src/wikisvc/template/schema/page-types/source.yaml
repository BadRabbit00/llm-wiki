type: source
prefix: src
path_template: sources/{slug}.md
title_ru: Источник
required_sections:
- Кратко
- Ключевые факты
- Что изменилось в вики
extra_fields:
  kind:
    required: true
    enum: [book, article, directive, chat, interview, doc, code, paper, datasheet, spec, course, video, rfc]
  author: {}
  year: {}
  edition: {}
  url:
    pattern: 'https?://[^\s@/]+(?:/\S*)?'
    max_length: 2048
  raw_path:
    required: true
    pattern: '(?:raw|library)/[^\\]+'
    enum: []
  raw_sha256:
    required: true
    pattern: '[a-f0-9]{64}'
  ingested_at:
    required: true
  covers:
    type: list
    item_pattern: 'top-[a-z0-9-]+'
allowed_relations:
- part_of
- depends_on
- related
template: "## Кратко\n\n\n## Ключевые факты\n\n\n## Что изменилось в вики\n"
